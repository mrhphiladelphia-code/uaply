name: Check the code

# Runs on every push and every pull request, so a change with a syntax error or a broken experiment is flagged
# before anyone merges it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all checks
        run: node check.js
